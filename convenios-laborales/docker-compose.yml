services:
  changedetection:
    image: dgtlmoon/changedetection.io:0.50.14
    restart: unless-stopped
    ports: ["127.0.0.1:5000:5000"]
    environment:
      BASE_URL: http://localhost:5000
    volumes:
      - ./changedetection:/datastore

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperless"]
      interval: 10s
      retries: 10

  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:2.18.4
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    ports: ["127.0.0.1:8000:8000"]
    environment:
      PAPERLESS_REDIS: redis://redis:6379
      PAPERLESS_DBHOST: postgres
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
      PAPERLESS_TIME_ZONE: Europe/Madrid
      PAPERLESS_OCR_LANGUAGE: spa+eng
      PAPERLESS_OCR_MODE: redo
      PAPERLESS_URL: http://localhost:8000
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:?Defina PAPERLESS_SECRET_KEY en .env}
    volumes:
      - paperless_data:/usr/src/paperless/data
      - paperless_media:/usr/src/paperless/media
      - ./paperless/consume:/usr/src/paperless/consume
      - ./paperless/export:/usr/src/paperless/export

  ollama:
    image: ollama/ollama:0.9.6
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    # Sin publicar el puerto: solo los contenedores internos acceden a Ollama.

  modelos:
    image: ollama/ollama:0.9.6
    depends_on: [ollama]
    environment:
      OLLAMA_HOST: http://ollama:11434
      MODELO: ${MODELO:-llama3.1:8b}
    entrypoint: ["/bin/sh", "-c"]
    command: ['until ollama list >/dev/null 2>&1; do sleep 3; done; ollama pull "$${MODELO}" && ollama pull nomic-embed-text']
    restart: "no"

  anythingllm:
    image: mintplexlabs/anythingllm:1.8.4
    restart: unless-stopped
    depends_on: [ollama]
    ports: ["127.0.0.1:3001:3001"]
    cap_add: [SYS_ADMIN]
    environment:
      STORAGE_DIR: /app/server/storage
      LLM_PROVIDER: ollama
      OLLAMA_BASE_PATH: http://ollama:11434
      OLLAMA_MODEL_PREF: ${MODELO:-llama3.1:8b}
      EMBEDDING_ENGINE: ollama
      EMBEDDING_MODEL_PREF: nomic-embed-text
      VECTOR_DB: lancedb
    volumes:
      - ./anythingllm:/app/server/storage

volumes:
  redis_data:
  postgres_data:
  paperless_data:
  paperless_media:
  ollama_data:
